<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui, sans-serif" font-size="13">
  <rect width="800" height="560" fill="#9cc3d9"/>
  <!-- land: south-west shore (hometown) and north-east mainland (city), bay between -->
  <path d="M0 330 C 120 300, 220 330, 300 380 C 360 420, 360 500, 330 560 L 0 560 Z" fill="#e8e2cf"/>
  <path d="M800 0 L 800 560 L 520 560 C 470 470, 430 380, 470 300 C 500 230, 430 170, 360 140 C 300 110, 260 60, 270 0 Z" fill="#e8e2cf"/>
  <!-- frozen forest + plateau -->
  <path d="M600 40 C 680 30, 760 60, 770 130 C 760 190, 680 200, 620 170 C 580 140, 570 70, 600 40 Z" fill="#cfe3ee" stroke="#7aa6bf"/>
  <path d="M400 20 C 460 10, 520 30, 530 80 C 520 120, 450 120, 410 100 C 380 80, 380 40, 400 20 Z" fill="#d9d4bd" stroke="#a89f7c"/>
  <!-- lagoon -->
  <ellipse cx="620" cy="400" rx="80" ry="55" fill="#b9d8e8" stroke="#7aa6bf"/>
  <!-- route: hometown -> coast road -> bridge -> city -> plateau -->
  <path d="M110 470 C 170 420, 230 400, 300 370 C 340 350, 360 320, 380 300" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-dasharray="10 6"/>
  <path d="M380 300 L 480 260" stroke="#c0392b" stroke-width="8"/>
  <path d="M480 260 C 520 240, 540 200, 520 160 C 500 130, 470 110, 460 90" fill="none" stroke="#8a6d3b" stroke-width="5" stroke-dasharray="10 6"/>
  <path d="M500 280 C 540 310, 560 330, 570 360 C 580 380, 600 390, 615 395" fill="none" stroke="#8a6d3b" stroke-width="4" stroke-dasharray="6 6"/>
  <!-- markers -->
  <g fill="#1d1d22">
    <circle cx="90" cy="480" r="9" fill="#555"/><text x="30" y="510">1 Hometown</text>
    <text x="30" y="526" fill="#555" font-size="11">school, houses, lighthouse hill</text>
    <rect x="40" y="430" width="8" height="30" fill="#fff" stroke="#555"/><text x="54" y="445" font-size="11">lighthouse</text>
    <circle cx="230" cy="400" r="14" fill="#7a5ea8" opacity=".8"/><text x="160" y="380">2 Coast road Fray</text>
    <text x="200" y="438" fill="#555" font-size="11">fenced; starters, first catches</text>
    <text x="370" y="330" transform="rotate(-22 370 330)">3 Great Naruto Bridge</text>
    <text x="420" y="320" fill="#555" font-size="11">rival battle</text>
    <circle cx="500" cy="280" r="10" fill="#2e6f9e"/><text x="512" y="296">4 Harbour, Water 7 canals</text>
    <circle cx="560" cy="330" r="9" fill="#e0b000"/><text x="572" y="334">5 Krusty Krab (rest stop)</text>
    <rect x="600" y="382" width="40" height="36" rx="6" fill="#4a5bd4"/><text x="560" y="478">7 League arena on the lagoon</text>
    <text x="560" y="494" fill="#555" font-size="11">ice floor, node under glass</text>
    <rect x="560" y="420" width="18" height="14" fill="#2f8a4a"/><text x="476" y="446" font-size="12">6 Ward shelter</text>
    <circle cx="690" cy="110" r="12" fill="#1d1d22"/><text x="640" y="225">8 Frozen forest: the Knot</text>
    <text x="640" y="241" fill="#555" font-size="11">forbidden; the glimpse</text>
    <circle cx="455" cy="70" r="14" fill="#7a5ea8" opacity=".8"/><text x="300" y="140">9 Northern Plateau Fray</text>
    <text x="300" y="156" fill="#555" font-size="11">route out, after the badge</text>
    <path d="M455 50 L 455 6" stroke="#8a6d3b" stroke-width="3" stroke-dasharray="6 4"/><text x="462" y="16" font-size="11" fill="#555">to Hawaii</text>
    <text x="160" y="250" fill="#2e5d78" font-size="15" font-style="italic">the bay</text>
  </g>
</svg>
