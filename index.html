<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familiar DB</title>
  <meta name="description" content="The Familiar team wiki: roster, story, gameplay and lore.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><a href="#home" class="brand">Familiar DB</a></h1>
    <nav id="crumb" aria-label="Breadcrumb"></nav>
    <span class="spacer"></span>
    <a href="https://github.com/zpivill/familiar-db#editing-online" target="_blank" rel="noopener">How to edit</a>
    <button id="signin" type="button" hidden>Sign in to edit</button>
    <button id="signout" type="button" hidden>Sign out</button>
  </header>

  <main id="home" class="page"></main>

  <div id="roster" class="page" hidden>
  <nav id="tabs" class="tabs" aria-label="Roster views"></nav>

  <section id="tab-characters" class="controls">
    <p id="count"></p>
    <input id="search" type="search" placeholder="Search name or anime">
    <div id="types" class="chips"></div>
    <div class="row">
      <label>Types <select id="kind">
        <option value="all">Mono and dual</option>
        <option value="mono">Mono only</option>
        <option value="dual">Dual only</option>
      </select></label>
      <label>Side <select id="side">
        <option value="all">Everyone</option>
        <option value="heroes">Heroes</option>
        <option value="villains">Villains</option>
        <option value="gags">Gag characters</option>
      </select></label>
      <label>Sort <select id="sort">
        <option value="number">Number</option>
        <option value="name">Name</option>
        <option value="type">Type</option>
        <option value="villain">Villains first</option>
      </select></label>
      <label class="check"><input id="evos" type="checkbox"> Show every evolution</label>
      <button id="clear" type="button">Clear filters</button>
      <button id="add" type="button" class="edit-only">+ Add character</button>
    </div>
    <p class="hint edit-only">Click a picture slot, then press Ctrl+V to paste a picture. You can also drag a picture file onto it.</p>
  </section>

  <main id="grid"></main>
  <main id="tab-view" class="view" hidden></main>
  </div>

  <main id="wiki" class="page" hidden></main>

  <dialog id="detail"></dialog>

  <script src="app.js"></script>
</body>
</html>
